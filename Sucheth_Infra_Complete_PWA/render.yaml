services:
  - type: web
    name: sucheth-infra-construction-manager
    runtime: docker
    region: singapore
    plan: starter
    healthCheckPath: /
    disk:
      name: sucheth-infra-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: APP_DB
        value: /var/data/construction.db
      - key: COOKIE_SECURE
        value: "1"
